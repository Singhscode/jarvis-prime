name: Deploy — Production

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify production secrets are set
        run: |
          echo "✓ Checking production environment secrets..."
          
          # Verify required secrets exist
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "❌ ERROR: SUPABASE_URL secret not set in GitHub Environment"
            exit 1
          fi
          
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "❌ ERROR: SUPABASE_SERVICE_ROLE_KEY secret not set in GitHub Environment"
            exit 1
          fi
          
          echo "✓ All required secrets verified"

      - name: Create production environment
        run: |
          cat > apps/site/.env.local << EOF
          NODE_ENV=production
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          N8N_WEBHOOK_URL=${{ secrets.N8N_WEBHOOK_URL }}
          DRY_RUN=false
          LOG_LEVEL=warn
          EOF
          
          cat > engine/.env << EOF
          NODE_ENV=production
          DRY_RUN=false
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APOLLO_API_KEY=${{ secrets.APOLLO_API_KEY }}
          HUNTER_API_KEY=${{ secrets.HUNTER_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL=${{ secrets.FROM_EMAIL }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          DAILY_PROSPECT_LIMIT=100
          DAILY_SEND_LIMIT=150
          LOG_LEVEL=warn
          EOF

      - name: Run final tests with production config
        run: npm run test:engine
        env:
          NODE_ENV: production
          DRY_RUN: 'true'

      - name: Build for production
        run: npm run build:site
        env:
          NODE_ENV: production

      - name: Deploy to Production
        run: |
          echo "🚀 PRODUCTION DEPLOYMENT INITIATED"
          echo "Deploying version: ${{ github.ref }}"
          echo ""
          echo "⚠️  CRITICAL: This is a production deployment"
          echo "All real secrets are now active"
          echo ""
          # Add your production deployment command here
          # Example: netlify deploy --prod --dir=apps/site/.next
          # Or: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
          echo "✓ Production deployment initiated"

      - name: Audit deployment
        run: |
          echo "📋 DEPLOYMENT AUDIT LOG"
          echo "========================"
          echo "Deployment Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Git Commit: ${{ github.sha }}"
          echo "Git Tag: ${{ github.ref }}"
          echo "Deployed By: GitHub Actions (Production Environment)"
          echo "========================"

      - name: Notify success
        if: success()
        run: |
          echo "✅ Production deployment completed successfully"
          echo "🔗 Production URL: https://www.jarvisprime.me"
          echo ""
          echo "Audit trail:"
          echo "  - Commit: ${{ github.sha }}"
          echo "  - Tag: ${{ github.ref }}"
          echo "  - Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Production deployment FAILED"
          echo "Immediate action required!"
          exit 1
