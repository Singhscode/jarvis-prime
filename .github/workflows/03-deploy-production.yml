name: Production Release Verification

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  verify-production-release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: cp apps/api/.env.test apps/api/.env
      - run: npm run test --workspace=apps/api
      - run: npm run build --workspace=apps/web
        env:
          NODE_ENV: production
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          PORTAL_COOKIE_SECRET: ${{ secrets.PORTAL_COOKIE_SECRET }}
      - name: Report verified release
        run: |
          echo "Production release verification passed for ${{ github.ref }}."
          echo "Deployment is handled by the configured hosting provider outside this workflow."
