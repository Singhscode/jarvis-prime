name: Phase 11 Production Migration Gate

# This manual, repository-owned gate is the only Phase 11 production migration
# path. It never invokes `supabase db push`, deploys an artifact, or activates a
# provider. The protected Environment supplies runtime-only database access.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only inspection, or the explicit 35-then-36 delivery path.
        required: true
        type: choice
        options:
          - inspect
          - apply
      confirmation:
        description: Select the confirmation matching the requested operation.
        required: true
        type: choice
        options:
          - INSPECT_ONLY
          - APPLY_FULL_35_THROUGH_40
      db_mode:
        description: 'Database connection mode: direct or session-pooler (for IPv4-only GitHub Actions runners).'
        required: true
        type: choice
        options:
          - direct
          - session-pooler
      git_sha:
        description: Exact reviewed main-branch SHA containing this gate (40 lowercase hex characters).
        required: true
        type: string
  # workflow_call inputs support only string, number, and boolean. `choice` is a
  # workflow_dispatch-only type; using it here made the reusable workflow fail
  # validation at planning time, before any job or runner started. The allowed
  # values are enforced at runtime by the "Validate manual operation and reviewed
  # SHA" step below and by assertProductionTarget in the gate script.
  workflow_call:
    inputs:
      operation:
        description: Read-only inspection, or the explicit 35-then-36 delivery path. Must be inspect or apply.
        required: true
        type: string
      confirmation:
        description: Select the confirmation matching the requested operation. Must be INSPECT_ONLY or APPLY_FULL_35_THROUGH_40.
        required: true
        type: string
      db_mode:
        description: 'Database connection mode: direct or session-pooler (for IPv4-only GitHub Actions runners).'
        required: true
        type: string
      git_sha:
        description: Exact reviewed main-branch SHA containing this gate (40 lowercase hex characters).
        required: true
        type: string
      database_url_b64:
        description: 'Production database URL, base64-encoded and passed from the dispatch caller workflow (which runs in the protected Environment and can access the secret). When provided, decoded and used as PHASE11_PRODUCTION_DATABASE_URL. Ignored when workflow_dispatch is used directly.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: phase11-production-migration-gate
  cancel-in-progress: false

jobs:
  phase11-migration-gate:
    runs-on: ubuntu-latest
    # Protected reviewers and the runtime-only secret/variable live here. No
    # production value is committed to this workflow.
    environment: jarvis-prime-api / production

    steps:
      - name: Validate manual operation and reviewed SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Refusing to run outside main." >&2
            exit 1
          fi
          if [[ ! "${{ inputs.git_sha }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "git_sha must be a full 40-character lowercase SHA." >&2
            exit 1
          fi
          case "${{ inputs.operation }}:${{ inputs.confirmation }}" in
            inspect:INSPECT_ONLY|apply:APPLY_FULL_35_THROUGH_40) ;;
            *) echo "Operation and confirmation do not match." >&2; exit 1 ;;
          esac

      - name: Check out the exact reviewed main-branch SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm requested SHA is reachable from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${{ inputs.git_sha }}" origin/main
          [[ "$(git rev-parse HEAD)" == "${{ inputs.git_sha }}" ]]

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run verify:automation:rollout-contract
      - name: Print immutable migration boundary
        run: node database/scripts/phase11-production-migration-gate.mjs --describe

      # The gate itself opens BEGIN READ ONLY before reading the ledger. This
      # preflight is mandatory even for apply and emits IDs/status only.
      - name: Decode production database URL from workflow_call input
        id: decode-db-url
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.database_url_b64 }}" ]]; then
            # Direct workflow_dispatch call: use the Environment secret directly
            echo "database_url_source=environment-secret"
            echo "Using Environment secret directly (workflow_dispatch caller)"
          else
            # workflow_call from dispatch caller: decode the base64 input
            decoded=$(printf '%s' "${{ inputs.database_url_b64 }}" | base64 -d)
            echo "database_url_source=workflow-call-input"
            echo "database_url=${decoded}" >> "${GITHUB_OUTPUT}"
            echo "Using base64-decoded URL from workflow_call input (dispatch caller provided)"
          fi

      - name: Diagnostic - verify Environment context
        shell: bash
        env:
          DATABASE_URL_PROVIDED: ${{ (secrets.PHASE11_PRODUCTION_DATABASE_URL != '' || steps.decode-db-url.outputs.database_url != '') && 'yes' || 'no' }}
          DATABASE_CA_PROVIDED: ${{ secrets.PHASE11_PRODUCTION_DATABASE_CA_PEM != '' && 'yes' || 'no' }}
          PROJECT_REF_PROVIDED: ${{ vars.PHASE11_PRODUCTION_PROJECT_REF != '' && 'yes' || 'no' }}
        run: |
          echo "=== Environment Context Diagnostic ==="
          echo "Job Environment: jarvis-prime-api / production"
          echo "Secret PHASE11_PRODUCTION_DATABASE_URL provided: ${{ secrets.PHASE11_PRODUCTION_DATABASE_URL != '' && 'yes' || 'no' }}"
          echo "Secret PHASE11_PRODUCTION_DATABASE_CA_PEM provided: ${DATABASE_CA_PROVIDED}"
          echo "Decoded URL from workflow_call: ${{ steps.decode-db-url.outputs.database_url != '' && 'yes' || 'no' }}"
          echo "Variable PHASE11_PRODUCTION_PROJECT_REF provided: ${PROJECT_REF_PROVIDED} (value: ${{ vars.PHASE11_PRODUCTION_PROJECT_REF }})"
          echo "Input db_mode: ${{ inputs.db_mode }}"
          echo "=== End Diagnostic ==="

      - name: Read-only production ledger preflight
        id: preflight
        env:
          PHASE11_PRODUCTION_DATABASE_URL: ${{ steps.decode-db-url.outputs.database_url != '' && steps.decode-db-url.outputs.database_url || secrets.PHASE11_PRODUCTION_DATABASE_URL }}
          PHASE11_PRODUCTION_DATABASE_CA_PEM: ${{ secrets.PHASE11_PRODUCTION_DATABASE_CA_PEM }}
          PHASE11_PRODUCTION_PROJECT_REF: ${{ vars.PHASE11_PRODUCTION_PROJECT_REF }}
          PHASE11_PRODUCTION_DB_MODE: ${{ inputs.db_mode }}
        run: |
          set -euo pipefail
          # The gate command is intentionally captured so its diagnostic output can be
          # inspected before this step decides whether to fail.
          OUTPUT=$(node database/scripts/phase11-production-migration-gate.mjs --inspect 2>&1 || true)
          printf '%s\n' "$OUTPUT"

          if grep -Eq \
            'PHASE11_GATE_(PRODUCTION_TARGET_UNVERIFIED|ORDERING_INVALID|LEDGER_CHECKSUM_MISMATCH|UNEXPECTED_POST_31_MIGRATION|PREDECESSOR_MISSING|STAGING_ONLY_37_PRESENT|LEDGER_INVALID)' \
            <<< "$OUTPUT"; then
            echo "violations_detected=true" >> "$GITHUB_OUTPUT"
            echo "Preflight detected violations - stopping." >&2
            exit 1
          fi

          echo "violations_detected=false" >> "$GITHUB_OUTPUT"
          echo "Preflight clean - no violations detected."

      - name: Selectively apply 35 through 40
        if: ${{ inputs.operation == 'apply' && steps.preflight.outputs.violations_detected == 'false' }}
        env:
          PHASE11_PRODUCTION_DATABASE_URL: ${{ steps.decode-db-url.outputs.database_url != '' && steps.decode-db-url.outputs.database_url || secrets.PHASE11_PRODUCTION_DATABASE_URL }}
          PHASE11_PRODUCTION_DATABASE_CA_PEM: ${{ secrets.PHASE11_PRODUCTION_DATABASE_CA_PEM }}
          PHASE11_PRODUCTION_PROJECT_REF: ${{ vars.PHASE11_PRODUCTION_PROJECT_REF }}
          PHASE11_PRODUCTION_DB_MODE: ${{ inputs.db_mode }}
        run: node database/scripts/phase11-production-migration-gate.mjs --apply

      - name: Read-only post-delivery ledger verification
        if: ${{ inputs.operation == 'apply' }}
        env:
          PHASE11_PRODUCTION_DATABASE_URL: ${{ steps.decode-db-url.outputs.database_url != '' && steps.decode-db-url.outputs.database_url || secrets.PHASE11_PRODUCTION_DATABASE_URL }}
          PHASE11_PRODUCTION_DATABASE_CA_PEM: ${{ secrets.PHASE11_PRODUCTION_DATABASE_CA_PEM }}
          PHASE11_PRODUCTION_PROJECT_REF: ${{ vars.PHASE11_PRODUCTION_PROJECT_REF }}
          PHASE11_PRODUCTION_DB_MODE: ${{ inputs.db_mode }}
        run: node database/scripts/phase11-production-migration-gate.mjs --inspect

      - name: Report constrained boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "Phase 11 migration gate completed."
          echo "No API/worker deployment, provider activation, or generic db push was performed."
