name: Deploy — Phase 11 Worker (ACA Production)

# Manual, image-only production worker release. This workflow never runs a
# migration, provisions ACA resources, changes identity/secrets/probes/scale, or
# enables any provider. Bicep owns configuration; platform approval owns its use.

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Exact reviewed implementation SHA to build (40 lowercase hex characters).
        required: true
        type: string
      api_release_sha:
        description: Exact SHA recorded by the successful paired production API release.
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: aca-worker-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build paired worker image and update production worker
    runs-on: ubuntu-latest
    # This protected Environment owns production OIDC credentials and resource
    # identifiers; none are committed in this workflow.
    environment: jarvis-prime-api / production
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_PRODUCTION_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_PRODUCTION_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_PRODUCTION_SUBSCRIPTION_ID }}
      ACR_LOGIN_SERVER: ${{ vars.PRODUCTION_ACR_LOGIN_SERVER }}
      ACR_NAME: ${{ vars.PRODUCTION_ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.PRODUCTION_RESOURCE_GROUP }}
      CONTAINER_APP_NAME: ${{ vars.PRODUCTION_WORKER_CONTAINER_APP }}
      IMAGE_REPOSITORY: ${{ vars.PRODUCTION_WORKER_IMAGE_REPOSITORY }}

    steps:
      - name: Validate protected production configuration and SHA pairing
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_LOGIN_SERVER ACR_NAME RESOURCE_GROUP CONTAINER_APP_NAME IMAGE_REPOSITORY; do
            if [[ -z "${!key:-}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required protected production configuration: ${missing[*]}" >&2
            exit 1
          fi
          for sha in "${{ inputs.git_sha }}" "${{ inputs.api_release_sha }}"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Both SHA inputs must be full 40-character lowercase commit SHAs." >&2
              exit 1
            fi
          done
          if [[ "${{ inputs.git_sha }}" != "${{ inputs.api_release_sha }}" ]]; then
            echo "Refusing worker release: git_sha must equal the paired production API release SHA." >&2
            exit 1
          fi
          for value in "$ACR_LOGIN_SERVER" "$ACR_NAME" "$RESOURCE_GROUP" "$CONTAINER_APP_NAME"; do
            if [[ "$(tr '[:upper:]' '[:lower:]' <<< "$value")" == *"staging"* ]]; then
              echo "Refusing to run: a production worker identifier references staging." >&2
              exit 1
            fi
          done

      - name: Check out the exact reviewed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
          persist-credentials: false

      - name: Confirm checked-out SHA and verify paired API deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "${{ inputs.git_sha }}" ]]; then
            echo "Checked-out SHA ($actual) does not match requested SHA (${{ inputs.git_sha }})." >&2
            exit 1
          fi
          api_runs="repos/${GITHUB_REPOSITORY}/actions/workflows/04-deploy-azure-api.yml/runs?head_sha=${{ inputs.api_release_sha }}&status=completed&per_page=100"
          successful_api_runs="$(gh api "$api_runs" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          if (( successful_api_runs < 1 )); then
            echo "No successful production API deployment workflow was found for ${{ inputs.api_release_sha }}." >&2
            exit 1
          fi
          {
            echo "## Phase 11 production artifact pairing"
            echo "- API release SHA: \`${{ inputs.api_release_sha }}\`"
            echo "- Worker image source SHA: \`$actual\`"
            echo "- Successful API deployment workflow evidence: verified"
            echo "- Pairing result: exact match"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to the production Azure Container Registry
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"

      - name: Build and push immutable paired worker image
        shell: bash
        run: |
          set -euo pipefail
          image="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:sha-${{ inputs.git_sha }}"
          echo "IMAGE_REF=$image" >> "$GITHUB_ENV"
          docker build --file Dockerfile --tag "$image" --label "org.opencontainers.image.revision=${{ inputs.git_sha }}" .
          docker push "$image"

      - name: Update only the production worker image
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --image "$IMAGE_REF"

      - name: Report constrained release boundary
        shell: bash
        run: |
          echo "Production worker image updated: $IMAGE_REF"
          echo "No migrations, secret changes, configuration changes, provider activation, or resource provisioning were performed."
