name: Phase 11 Production Migration Gate Dispatch

# Manual control-plane entrypoint for the Phase 11 production migration gate.
#
# The GitHub workflow-dispatch API refuses to dispatch this repository's Phase 11
# workflows (HTTP 422 "Workflow does not have 'workflow_dispatch' trigger") even
# though the YAML declares the trigger, so the documented `repository_dispatch`
# event is used as the manual trigger instead. This workflow authorizes the
# operator, validates the payload, and then performs the same reviewed gate
# checks inside the protected production Environment.
#
# APPROVED OPERATOR ALLOWLIST
# ---------------------------
# Authorization is driven by the REPOSITORY-level GitHub Actions variable
# `PHASE11_APPROVED_OPERATORS` (Settings -> Secrets and variables -> Actions ->
# Variables -> Repository variables). It holds a comma-, semicolon-, or
# newline-separated list of approved GitHub logins, compared case-insensitively
# against `github.actor`.
#
# The list is deliberately NOT environment-scoped: an environment-scoped
# variable is only readable from a job that declares that environment, which
# would consume a production reviewer approval before authorization could run.
# The list is deliberately NOT committed here so that rotating an operator does
# not require a code change.
#
# If `PHASE11_APPROVED_OPERATORS` is unset or empty, EVERY dispatch fails
# closed. Populate it before the first dispatch.
#
# Dispatch (approved operator, from an authorized client):
#   POST /repos/Singhscode/jarvis-prime/dispatches
#   { "event_type": "phase11-production-inspect",
#     "client_payload": { "operation": "inspect",
#                         "confirmation": "INSPECT_ONLY",
#                         "db_mode": "session-pooler",
#                         "git_sha": "<40 lowercase hex main SHA>" } }

on:
  repository_dispatch:
    types:
      - phase11-production-inspect

permissions:
  contents: read

concurrency:
  group: phase11-production-migration-dispatch
  cancel-in-progress: false

jobs:
  # Gate 1: only an explicitly approved operator may proceed. This job has no
  # environment, no secrets, and no production access of any kind.
  authorize-operator:
    runs-on: ubuntu-latest
    steps:
      - name: Require github.actor to be an approved Phase 11 operator
        shell: bash
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
          APPROVED_OPERATORS: ${{ vars.PHASE11_APPROVED_OPERATORS }}
        run: |
          set -euo pipefail
          if [[ -z "${APPROVED_OPERATORS//[[:space:]]/}" ]]; then
            echo "Repository variable PHASE11_APPROVED_OPERATORS is unset or empty; failing closed." >&2
            exit 1
          fi
          actor_lower="$(printf '%s' "${DISPATCH_ACTOR}" | tr '[:upper:]' '[:lower:]')"
          authorized=false
          while IFS= read -r entry; do
            entry="$(printf '%s' "${entry}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            if [[ -n "${entry}" && "${entry}" == "${actor_lower}" ]]; then
              authorized=true
            fi
          done < <(printf '%s\n' "${APPROVED_OPERATORS}" | tr ',;' '\n')
          if [[ "${authorized}" != "true" ]]; then
            echo "Actor is not an approved Phase 11 production operator; failing closed." >&2
            exit 1
          fi
          echo "Dispatch actor is an approved Phase 11 production operator."

  # Gate 2: fail closed on anything other than a read-only session-pooler
  # inspection. Also credential-free and environment-free.
  validate-inspect-payload:
    needs: authorize-operator
    runs-on: ubuntu-latest
    steps:
      - name: Require a read-only session-pooler inspection payload
        shell: bash
        env:
          PAYLOAD_OPERATION: ${{ github.event.client_payload.operation }}
          PAYLOAD_CONFIRMATION: ${{ github.event.client_payload.confirmation }}
          PAYLOAD_DB_MODE: ${{ github.event.client_payload.db_mode }}
          PAYLOAD_GIT_SHA: ${{ github.event.client_payload.git_sha }}
        run: |
          set -euo pipefail
          if [[ "${PAYLOAD_OPERATION}" != "inspect" ]]; then
            echo "operation must be exactly 'inspect' for repository_dispatch." >&2
            exit 1
          fi
          if [[ "${PAYLOAD_CONFIRMATION}" != "INSPECT_ONLY" ]]; then
            echo "confirmation must be exactly 'INSPECT_ONLY' for repository_dispatch." >&2
            exit 1
          fi
          if [[ "${PAYLOAD_DB_MODE}" != "session-pooler" ]]; then
            echo "db_mode must be exactly 'session-pooler' for repository_dispatch." >&2
            exit 1
          fi
          if [[ ! "${PAYLOAD_GIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "git_sha must be a full 40-character lowercase SHA." >&2
            exit 1
          fi
          echo "Validated read-only inspection payload for ${PAYLOAD_GIT_SHA}."

  # Run the gate checks directly in the protected Environment. Reusable workflow
  # job outputs are secret-redacted by Actions, so Environment secrets cannot be
  # relayed safely through workflow_call inputs from an intermediate job.
  call-migration-gate:
    name: call-migration-gate / phase11-migration-gate
    needs:
      - authorize-operator
      - validate-inspect-payload
    runs-on: ubuntu-latest
    environment: jarvis-prime-api / production
    steps:
      - name: Validate dispatch payload and reviewed SHA
        shell: bash
        env:
          PAYLOAD_OPERATION: ${{ github.event.client_payload.operation }}
          PAYLOAD_CONFIRMATION: ${{ github.event.client_payload.confirmation }}
          PAYLOAD_DB_MODE: ${{ github.event.client_payload.db_mode }}
          PAYLOAD_GIT_SHA: ${{ github.event.client_payload.git_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Refusing to run outside main." >&2
            exit 1
          fi
          if [[ ! "${PAYLOAD_GIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "git_sha must be a full 40-character lowercase SHA." >&2
            exit 1
          fi
          case "${PAYLOAD_OPERATION}:${PAYLOAD_CONFIRMATION}" in
            inspect:INSPECT_ONLY|apply:APPLY_FULL_35_THROUGH_40) ;;
            *) echo "Operation and confirmation do not match." >&2; exit 1 ;;
          esac
          if [[ "${PAYLOAD_DB_MODE}" != "session-pooler" ]]; then
            echo "db_mode must be exactly 'session-pooler' for repository_dispatch." >&2
            exit 1
          fi

      - name: Check out the exact reviewed main-branch SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm requested SHA is reachable from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${{ github.event.client_payload.git_sha }}" origin/main
          [[ "$(git rev-parse HEAD)" == "${{ github.event.client_payload.git_sha }}" ]]

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run verify:automation:rollout-contract

      - name: Print immutable migration boundary
        run: node database/scripts/phase11-production-migration-gate.mjs --describe

      - name: Diagnostic - verify Environment context
        shell: bash
        env:
          PROJECT_REF_PROVIDED: ${{ vars.PHASE11_PRODUCTION_PROJECT_REF != '' && 'yes' || 'no' }}
          DATABASE_CA_PROVIDED: ${{ secrets.PHASE11_PRODUCTION_DATABASE_CA_PEM != '' && 'yes' || 'no' }}
        run: |
          echo "=== Environment Context Diagnostic ==="
          echo "Job Environment: jarvis-prime-api / production"
          echo "Secret PHASE11_PRODUCTION_DATABASE_URL provided: ${{ secrets.PHASE11_PRODUCTION_DATABASE_URL != '' && 'yes' || 'no' }}"
          echo "Secret PHASE11_PRODUCTION_DATABASE_CA_PEM provided: ${DATABASE_CA_PROVIDED}"
          echo "Variable PHASE11_PRODUCTION_PROJECT_REF provided: ${PROJECT_REF_PROVIDED} (value: ${{ vars.PHASE11_PRODUCTION_PROJECT_REF }})"
          echo "Input db_mode: ${{ github.event.client_payload.db_mode }}"
          echo "=== End Diagnostic ==="

      - name: Read-only production ledger preflight
        env:
          PHASE11_PRODUCTION_DATABASE_URL: ${{ secrets.PHASE11_PRODUCTION_DATABASE_URL }}
          PHASE11_PRODUCTION_DATABASE_CA_PEM: ${{ secrets.PHASE11_PRODUCTION_DATABASE_CA_PEM }}
          PHASE11_PRODUCTION_PROJECT_REF: ${{ vars.PHASE11_PRODUCTION_PROJECT_REF }}
          PHASE11_PRODUCTION_DB_MODE: ${{ github.event.client_payload.db_mode }}
        run: node database/scripts/phase11-production-migration-gate.mjs --inspect

      - name: Report constrained boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "Phase 11 migration gate completed."
          echo "No API/worker deployment, provider activation, or generic db push was performed."
