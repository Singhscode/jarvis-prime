name: Deploy — Azure Production API

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/04-deploy-azure-api.yml'
  workflow_dispatch:
    inputs:
      git_sha:
        description: Exact reviewed API SHA to deploy (40 lowercase hex characters).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: azure-api-production
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: jarvis-prime-api
  NODE_VERSION: '22'

jobs:
  verify-build-deploy:
    name: Verify, package, and deploy API
    # This gate prevents checkout, protected Environment access, and Azure OIDC
    # login for a dispatch that is not on the canonical production branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: "jarvis-prime-api / production"
    env:
      REQUESTED_GIT_SHA: ${{ inputs.git_sha || github.sha }}
      AZURE_WEBAPP_RESOURCE_GROUP: ${{ vars.PRODUCTION_RESOURCE_GROUP }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate exact deployment SHA and protected production configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_GIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Production API deployment SHA must be a full 40-character lowercase commit SHA." >&2
            exit 1
          fi
          if [[ -z "$AZURE_WEBAPP_RESOURCE_GROUP" ]]; then
            echo "Missing required protected production configuration: PRODUCTION_RESOURCE_GROUP." >&2
            exit 1
          fi
          if [[ "$(tr '[:upper:]' '[:lower:]' <<< "$AZURE_WEBAPP_RESOURCE_GROUP")" == *"staging"* ]]; then
            echo "Refusing to run: the production API resource group references staging." >&2
            exit 1
          fi

      - name: Check out the exact requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REQUESTED_GIT_SHA }}
          fetch-depth: 0

      - name: Require trusted main source and exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Production API deployment is permitted only from refs/heads/main; got ${GITHUB_REF}." >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$REQUESTED_GIT_SHA" origin/main; then
            echo "Production API deployment SHA $REQUESTED_GIT_SHA is not reachable from origin/main." >&2
            exit 1
          fi

          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$REQUESTED_GIT_SHA" ]]; then
            echo "Checked-out SHA ($actual) does not match requested SHA ($REQUESTED_GIT_SHA)." >&2
            exit 1
          fi
          echo "RELEASE_SHA=$actual" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install monorepo dependencies from root lockfile
        run: npm ci

      - name: Prepare API test environment
        run: cp apps/api/.env.test apps/api/.env

      - name: Test API workspace
        run: npm run test --workspace=apps/api

      - name: Install API production dependencies from root lockfile
        run: npm ci --omit=dev --workspace=apps/api --include-workspace-root=false

      - name: Create API-only deployment artifact
        shell: bash
        run: |
          set -euo pipefail

          artifact="$RUNNER_TEMP/jarvis-prime-api"
          rm -rf "$artifact"
          mkdir -p "$artifact/node_modules"

          cp apps/api/package.json "$artifact/package.json"
          cp -R apps/api/src "$artifact/src"
          rsync -a \
            --exclude '/.bin/' \
            --exclude '/@jarvis-prime/' \
            node_modules/ "$artifact/node_modules/"

      - name: Verify API-only deployment artifact
        shell: bash
        run: |
          set -euo pipefail

          artifact="$RUNNER_TEMP/jarvis-prime-api"

          test -f "$artifact/package.json"
          test -d "$artifact/src"
          test -d "$artifact/node_modules"

          unexpected="$(find "$artifact" -mindepth 1 -maxdepth 1 \
            ! -name package.json \
            ! -name src \
            ! -name node_modules \
            -print -quit)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected top-level artifact entry: $unexpected" >&2
            exit 1
          fi

          for forbidden in \
            "$artifact/apps" \
            "$artifact/test" \
            "$artifact/tests" \
            "$artifact/integration" \
            "$artifact/database" \
            "$artifact/.env" \
            "$artifact/.env.local" \
            "$artifact/.env.production"; do
            if [[ -e "$forbidden" ]]; then
              echo "Forbidden artifact entry found: $forbidden" >&2
              exit 1
            fi
          done

          if find "$artifact" -type l -print -quit | grep -q .; then
            echo 'Deployment artifact must not contain symbolic links.' >&2
            exit 1
          fi

          node -e "const p=require(process.argv[1]); if(p.name!=='@jarvis-prime/api') process.exit(1)" \
            "$artifact/package.json"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ runner.temp }}/jarvis-prime-api

      - name: Require deployed API readiness
        shell: bash
        run: |
          set -euo pipefail

          api_host="$(az webapp show --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_WEBAPP_RESOURCE_GROUP" --query defaultHostName -o tsv)"
          if [[ -z "$api_host" || "$api_host" == "null" ]]; then
            echo 'Unable to resolve the deployed production API hostname.' >&2
            exit 1
          fi

          ready_url="https://${api_host}/ready"
          max_attempts=30
          delay_seconds=2
          for (( attempt = 1; attempt <= max_attempts; attempt += 1 )); do
            if curl --fail --silent --show-error --max-time 10 "$ready_url" | jq -e '.ready == true' >/dev/null; then
              {
                echo "## Phase 11 production API readiness"
                echo "- Endpoint: \`GET /ready\`"
                echo "- Result: HTTP 200 with \`ready=true\`"
                echo "- Attempts: \`$attempt\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if (( attempt < max_attempts )); then
              sleep "$delay_seconds"
              delay_seconds=$(( delay_seconds < 30 ? delay_seconds * 2 : 30 ))
            fi
          done

          {
            echo "## Phase 11 production API readiness"
            echo "- Endpoint: \`GET /ready\`"
            echo "- Result: readiness did not return HTTP 200 with \`ready=true\` after \`$max_attempts\` bounded attempts"
            echo "- Automatic rollback: not attempted"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "API readiness did not succeed after ${max_attempts} attempts." >&2
          exit 1

      - name: Record deployed API SHA for paired worker release
        shell: bash
        run: |
          {
            echo "## Phase 11 production artifact pairing"
            echo "- Deployed API release SHA: \`${RELEASE_SHA}\`"
            echo "- The worker workflow verifies a successful run of this deployment workflow at this exact SHA before it can update the worker image."
          } >> "$GITHUB_STEP_SUMMARY"
