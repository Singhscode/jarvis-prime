name: Phase 11 - Verify Production Target Configuration

# This workflow is diagnostic only.
# It extracts the project reference from the production database URL
# and compares it against the configured PHASE11_PRODUCTION_PROJECT_REF variable.
# 
# No migrations, no mutations, no gate operations.
# Output only verification results to aid manual Environment correction.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-target:
    runs-on: ubuntu-latest
    environment: jarvis-prime-api / production

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify production target configuration
        id: verify
        env:
          PHASE11_PRODUCTION_DATABASE_URL: ${{ secrets.PHASE11_PRODUCTION_DATABASE_URL }}
          PHASE11_PRODUCTION_PROJECT_REF: ${{ vars.PHASE11_PRODUCTION_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Phase 11 Production Target Verification ==="
          echo ""
          echo "Current Configuration:"
          echo "  PHASE11_PRODUCTION_PROJECT_REF (configured): ${{ vars.PHASE11_PRODUCTION_PROJECT_REF }}"
          echo ""

          # Extract project reference from the database URL (secret, not printed)
          if [[ -z "$PHASE11_PRODUCTION_DATABASE_URL" ]]; then
            echo "ERROR: PHASE11_PRODUCTION_DATABASE_URL is not set in protected Environment" >&2
            exit 1
          fi

          # Parse hostname from database URL using node
          EXTRACTED_REF=$(node -e "
            const url = require('url');
            const dbUrl = process.env.PHASE11_PRODUCTION_DATABASE_URL;
            try {
              const parsed = new url.URL(dbUrl);
              const hostname = parsed.hostname;
              const match = hostname.match(/^([a-z0-9]{20,})(?:\.|$)/);
              if (match && match[1]) {
                console.log(match[1]);
              } else {
                throw new Error('Could not extract project reference');
              }
            } catch (e) {
              console.error('Failed to parse URL:', e.message);
              process.exit(1);
            }
          " 2>&1) || { echo "ERROR: Could not extract project reference from database URL" >&2; exit 1; }

          echo "  PHASE11_PRODUCTION_PROJECT_REF (from URL): ${EXTRACTED_REF}"
          echo ""

          # Compare
          if [[ "$EXTRACTED_REF" == "${{ vars.PHASE11_PRODUCTION_PROJECT_REF }}" ]]; then
            echo "✓ Project Reference Match: PASS"
            echo "  The configured PHASE11_PRODUCTION_PROJECT_REF matches the database URL."
            echo "project_ref_match=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "✗ Project Reference Match: FAIL"
            echo "  Mismatch detected:"
            echo "    Configured: ${{ vars.PHASE11_PRODUCTION_PROJECT_REF }}"
            echo "    In URL:     ${EXTRACTED_REF}"
            echo ""
            echo "  REQUIRED FIX:"
            echo "    Update PHASE11_PRODUCTION_PROJECT_REF to: ${EXTRACTED_REF}"
            echo ""
            echo "project_ref_match=FAIL" >> "$GITHUB_OUTPUT"
            echo "correct_project_ref=${EXTRACTED_REF}" >> "$GITHUB_OUTPUT"
          fi

          echo ""
          echo "=== Next Steps ==="
          if [[ "$(cat $GITHUB_OUTPUT | grep project_ref_match)" == *"FAIL"* ]]; then
            echo "1. Navigate to: GitHub Settings > Environments > jarvis-prime-api / production"
            echo "2. Edit Variable: PHASE11_PRODUCTION_PROJECT_REF"
            echo "3. Set to: ${EXTRACTED_REF}"
            echo "4. Save"
            echo "5. Re-run the Phase 11 Production Migration Gate with operation=inspect"
          else
            echo "Configuration is correct. Proceed with Phase 11 gate inspection."
          fi
