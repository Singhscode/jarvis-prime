name: Deploy — Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: cp apps/api/.env.test apps/api/.env
      - run: npm run test --workspace=apps/api
      - run: npm run build --workspace=apps/web
        env:
          PORTAL_PASSWORD: staging-portal-password
          PORTAL_COOKIE_SECRET: staging-cookie-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - run: echo "✓ Staging deployment ready"
