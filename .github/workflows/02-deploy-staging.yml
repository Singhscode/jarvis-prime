name: Deploy — Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Load staging environment
        run: |
          cp apps/api/.env.test apps/api/.env
          if [ -f "apps/web/.env.development" ]; then
            cp apps/web/.env.development apps/web/.env.local
          fi

      - name: Run tests before deploy
        run: npm run test --workspace=apps/api

      - name: Build site for staging
        run: npm run build --workspace=apps/web
        env:
          NODE_ENV: staging
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          PORTAL_COOKIE_SECRET: ${{ secrets.PORTAL_COOKIE_SECRET }}

      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying to staging..."
          echo "✓ Staging deployment initiated"

      - name: Notify deployment
        if: success()
        run: echo "✓ Staging deployment completed successfully"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Staging deployment failed"
          exit 1
