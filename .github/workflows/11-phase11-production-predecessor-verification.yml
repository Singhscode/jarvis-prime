name: Phase 11 — Production Predecessor Verification (Read-Only)
# =============================================================================
# TEMPORARY READ-ONLY DIAGNOSTIC WORKFLOW
#
# This workflow queries production schema metadata only to verify whether
# migrations 20260810000023 through 20260810000031 have been applied.
#
# It performs NO modifications: queries information_schema/pg_catalog only,
# reports object presence, and logs final classification.
#
# This is a temporary diagnostic and should be deleted after verification.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      db_mode:
        description: 'Database connection mode: direct or session-pooler'
        required: true
        type: choice
        options:
          - direct
          - session-pooler

permissions:
  contents: read

jobs:
  verify-predecessor-presence:
    name: Read-Only Schema Verification
    runs-on: ubuntu-latest
    environment: jarvis-prime-api / production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run exact read-only ledger verification
        env:
          PHASE11_PRODUCTION_DATABASE_URL: ${{ secrets.PHASE11_PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail

          DB_URL="$PHASE11_PRODUCTION_DATABASE_URL"
          LEDGER_QUERY_FILE=/tmp/phase11_exact_ledger.sql
          LEDGER_RESULT_FILE=/tmp/phase11_exact_ledger.csv
          IDENTITY_QUERY_FILE=/tmp/phase11_database_identity.sql
          IDENTITY_RESULT_FILE=/tmp/phase11_database_identity.csv
          ERROR_FILE=/tmp/phase11_psql_error.log
          trap 'rm -f "$LEDGER_QUERY_FILE" "$LEDGER_RESULT_FILE" "$IDENTITY_QUERY_FILE" "$IDENTITY_RESULT_FILE" "$ERROR_FILE"' EXIT

          cat > "$LEDGER_QUERY_FILE" <<'SQL_EOF'
          SELECT version, name, statements
          FROM supabase_migrations.schema_migrations
          WHERE version IN (
            '20260810000023',
            '20260810000024',
            '20260810000025',
            '20260810000026',
            '20260810000027',
            '20260810000028',
            '20260810000029',
            '20260810000030',
            '20260810000031'
          )
          ORDER BY version;
          SQL_EOF

          cat > "$IDENTITY_QUERY_FILE" <<'SQL_EOF'
          SELECT current_database(), inet_server_addr(), inet_server_port();
          SQL_EOF

          # Execute the exact row query, but retain its CSV result privately so
          # names/statements are never printed. No write-capable SQL is used.
          if ! psql --no-psqlrc --quiet --tuples-only --csv "$DB_URL" \
            --file "$LEDGER_QUERY_FILE" > "$LEDGER_RESULT_FILE" 2> "$ERROR_FILE"; then
            exit 1
          fi

          # Execute the database identity query against the same protected URL.
          if ! psql --no-psqlrc --quiet --tuples-only --csv "$DB_URL" \
            --file "$IDENTITY_QUERY_FILE" > "$IDENTITY_RESULT_FILE" 2> "$ERROR_FILE"; then
            exit 1
          fi

          python3 - "$LEDGER_RESULT_FILE" "$IDENTITY_RESULT_FILE" <<'PY_EOF'
          import csv
          import sys

          ledger_path, identity_path = sys.argv[1:]
          canonical = [
              '20260810000023', '20260810000024', '20260810000025',
              '20260810000026', '20260810000027', '20260810000028',
              '20260810000029', '20260810000030', '20260810000031',
          ]

          with open(ledger_path, newline='', encoding='utf-8') as handle:
              ledger_rows = list(csv.reader(handle))
          found_versions = [row[0] for row in ledger_rows if row and row[0]]
          missing_versions = [version for version in canonical if version not in set(found_versions)]

          for version in found_versions:
              print(version)
          print(f'EXACT_COUNT_FOUND: {len(found_versions)}')

          with open(identity_path, newline='', encoding='utf-8') as handle:
              identity_rows = list(csv.reader(handle))
          if len(identity_rows) != 1 or len(identity_rows[0]) != 3:
              raise SystemExit(1)
          database_name, server_address, server_port = identity_rows[0]
          print(f'DATABASE_NAME: {database_name}')
          print(f'SERVER_ADDRESS: {server_address}')
          print(f'SERVER_PORT: {server_port}')

          if missing_versions:
              print('MISSING_CANONICAL_VERSIONS:')
              for version in missing_versions:
                  print(version)
          else:
              print('MISSING_CANONICAL_VERSIONS: NONE')
          PY_EOF
