name: CI — Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: npm run db:reset
      - run: cp apps/api/.env.test apps/api/.env
      - run: npm run test:integration:db --workspace=apps/api
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - run: npm run test --workspace=apps/api

  test-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --workspace=apps/web
      - run: npm run build --workspace=apps/web
        env:
          PORTAL_PASSWORD: ci-test-portal-password
          PORTAL_COOKIE_SECRET: ci-test-cookie-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaa

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect committed secrets
        run: |
          echo "Checking for secret files..."
          [ -f ".env" ] && echo "ERROR: .env committed" && exit 1
          [ -f "apps/web/.env.local" ] && echo "ERROR: .env.local committed" && exit 1
          echo "✓ Clean"
