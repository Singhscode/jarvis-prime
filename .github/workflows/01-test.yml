name: CI — Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Load test environment
        run: cp packages/engine/.env.test packages/engine/.env

      - name: Run engine tests
        run: npm run test:engine

      - name: Run engine doctor (health check)
        run: npm run doctor --workspace=packages/engine
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-not-for-prod-aaaaaaaaaaaaaaaaaaaaaaaaaaa

  test-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Load test environment
        run: cp apps/.env.test apps/.env.local

      - name: Lint site
        run: npm run lint --workspace=apps

      - name: Build site
        run: npm run build:site
        env:
          # Portal auth — safe test values for CI build (never real secrets)
          PORTAL_PASSWORD: ci-test-portal-password
          PORTAL_COOKIE_SECRET: ci-test-cookie-secret-not-for-prod-aaaaaaaaaaaaaaa

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Detect secrets in env files
        run: |
          echo "Checking for hardcoded secrets in .env files..."

          if [ -f ".env" ]; then
            echo "ERROR: .env file should not be committed!"
            exit 1
          fi

          if [ -f "apps/.env.local" ]; then
            echo "ERROR: apps/.env.local should not be committed!"
            exit 1
          fi

          if [ -f "packages/engine/.env" ] && [ ! -f "packages/engine/.env.test" ]; then
            echo "ERROR: packages/engine/.env should not be committed (use .env.test in CI)!"
            exit 1
          fi

          echo "✓ No secret files detected in commit"
